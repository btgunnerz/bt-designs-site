<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Intake | BT Designs Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Roboto Mono', 'Architects Daughter', sans-serif;
        background-color: linear-gradient(135deg, #0a3d62 0%, #1e5799 40%, #2980b9 100%);
        color: #ffffff;
        margin: 0;
        padding: 0;
    }

    /* Navigation Bar */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #003d73;
        padding: 15px 25px;
        border-bottom: 3px solid #00264d;
        font-family: 'Roboto Mono', monospace;
    }

    .nav-left .nav-logo {
        color: white;
        font-size: 1.4rem;
        font-weight: bold;
        text-decoration: none;
    }

    .nav-right a {
        color: white;
        margin-left: 20px
        text-decoration: none;
        font-size: 1rem;
    }

    .nav-right a:hover {
        text-decoration: underline;
    }

    /* HEADER */
    header {
        background-image: url('images/architectural-blueprint-bg.png');
        background-size: cover;
        background-position: center;
        color: white;
        text-align: center;
        padding: 40px 20px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        border-bottom: 2px solid #0077ff;
    }
    header img {
        max-width: 320px;
        height: auto;
        margin-bottom: 15px;
    }
    form {
        max-width: 700px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        border: 1px solid #0077ff;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    input, textarea, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: 'Roboto Mono', monospace;
    }
    button {
        background: #0077ff;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        margin-top: 20px;
        cursor: pointer;
        letter-spacing: 1px;
    }
    button:hover {
        background: #005fcc;
    }
    footer {
        text-align: center;
        padding: 20px;
        background: #eaeaea;
        margin-top: 40px;
        font-family: 'Roboto Mono', monospace;
        font-size: 0.9rem;
        color: #555;
        border-top: 1px solid #0077ff;
    }
</style>
</head>
    <body>

    <header>
       <img src="images/bt-designs-logo.png" alt="BT Designs Inc. Logo">
    </header>

    <div class="container">
        <form action="https://formspree.io/f/xljewrbb" methond="POST" enctype="multipart/form-data">
            <label>Your Name</label>
            <input type="text" name="name" Required>

            <label>Email Address</label>
            <input type="email" name="email" Required>

            <label>Phone Number</label>
            <input type="text" name="phone">

            <label>Project Description *</label>
            <textarea name="message" placeholder="Describe your sketch, layout, or CAD needs..." required></textarea>

            <label>Upload Sketch / Images *</label>
            <input type="file" name="file" required>

            <button type="submit">Submit</button>
        </form>
    </div>

        <footer>BT DESIGNS INC. | ARCHITECTURAL DESIGNS | SPACE PLANNING | CAD DRAFTING | 3D MODELLING</footer>
    </body>
</html>
