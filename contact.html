<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Intake | BT Designs Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Roboto Mono', 'Architects Daughter', sans-serif;
        background-color: #e6eef5;
        color: #1a1a1a;
        margin: 0;
        padding: 0;
    }
    header {
        background-image: url('images/architectural-blueprint-bg.png');
        background-size: cover;
        background-position: center;
        color: white;
        text-align: center;
        padding: 40px 20px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        border-bottom: 2px solid #0077ff;
    }
    header img {
        max-width: 320px;
        height: auto;
        margin-bottom: 15px;
    }
    form {
        max-width: 700px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        border: 1px solid #0077ff;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    input, textarea, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: 'Roboto Mono', monospace;
    }
    button {
        background: #0077ff;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        margin-top: 20px;
        cursor: pointer;
        letter-spacing: 1px;
    }
    button:hover {
        background: #005fcc;
    }
    footer {
        text-align: center;
        padding: 20px;
        background: #eaeaea;
        margin-top: 40px;
        font-family: 'Roboto Mono', monospace;
        font-size: 0.9rem;
        color: #555;
        border-top: 1px solid #0077ff;
    }
</style>
</head>
<body>

<header>
    <img src="images/bt-designs-logo.png" alt="BT Designs Inc. Logo">
    <h1>Project Intake Form</h1>
    <p>Submit your sketch and details below to start your CAD floor plan.</p>
</header>

<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" enctype="multipart/form-data">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="_replyto" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone">

    <label for="project-type">Project Type</label>
    <select id="project-type" name="project-type" required>
        <option value="">Select...</option>
        <option value="Basic Sketch → CAD">Basic Sketch → CAD</option>
        <option value="Sketch → CAD + Furniture Layout">Sketch → CAD + Furniture Layout</option>
        <option value="Sketch → CAD + Color Plan">Sketch → CAD + Color Plan</option>
        <option value="Multi-Floor Bundle">Multi-Floor Bundle</option>
    </select>

    <label for="measurements">Measurements / Notes</label>
    <textarea id="measurements" name="measurements" rows="5" placeholder="Enter room dimensions, notes, or special requests..."></textarea>

    <label for="sketch">Upload Sketch or Photos</label>
    <input type="file" id="sketch" name="sketch" accept="image/*, .pdf">

    <button type="submit">Submit Project</button>
</form>

<footer>
    DRAWN BY BT DESIGNS INC. — ARCHITECTURAL DESIGNS | SPACE PLANNING | DRAFTING
</footer>

</body>
</html>
